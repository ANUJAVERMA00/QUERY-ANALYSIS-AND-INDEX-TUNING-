# ================================================================
#  MySQL 8.0  —  Custom Configuration
#  DBA Lab: Performance-Driven DBA · Query Optimization
#
#  Windows path : C:\ProgramData\MySQL\MySQL Server 8.0\my.ini
#  Linux path   : /etc/mysql/my.cnf
# ================================================================

[client]
port                           = 3306
default-character-set          = utf8mb4

[mysqld]
# ── Network ──────────────────────────────────────────────────
port                           = 3306
bind-address                   = 127.0.0.1

# ── Character Set ─────────────────────────────────────────────
character-set-server           = utf8mb4
collation-server               = utf8mb4_unicode_ci

# ── InnoDB Buffer Pool  (KEY DBA VARIABLE) ────────────────────
# Increased from default 128 MB → 1 GB.
# When the buffer pool is larger than the index (idx_symbol ≈ 3 MB)
# the entire B-Tree index is served from RAM → latency drops from
# ~340 ms (disk scan) to ~2 ms (in-memory lookup).
innodb_buffer_pool_size        = 1G
innodb_buffer_pool_instances   = 2
innodb_buffer_pool_dump_at_shutdown = ON
innodb_buffer_pool_load_at_startup  = ON

# ── InnoDB Log ────────────────────────────────────────────────
innodb_log_file_size           = 256M
innodb_log_buffer_size         = 64M
innodb_flush_log_at_trx_commit = 1        # ACID — safest
innodb_flush_method            = O_DIRECT # bypass OS cache (Linux)

# ── Connections ───────────────────────────────────────────────
max_connections                = 200
wait_timeout                   = 600
interactive_timeout            = 600

# ── Slow Query Log (enable during lab) ────────────────────────
slow_query_log                 = ON
slow_query_log_file            = slow_queries.log
long_query_time                = 0.5      # log queries > 500 ms
log_queries_not_using_indexes  = ON       # flags full-table scans

# ── Tuning ────────────────────────────────────────────────────
sort_buffer_size               = 4M
read_buffer_size               = 2M
join_buffer_size               = 4M
tmp_table_size                 = 64M
max_heap_table_size            = 64M

# ── Performance Schema ────────────────────────────────────────
performance_schema             = ON

[mysqldump]
quick
max_allowed_packet             = 64M

[mysql]
default-character-set          = utf8mb4
# ================================================================